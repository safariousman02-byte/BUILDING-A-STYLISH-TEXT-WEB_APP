<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glyph & Silk - Collection</title>
    <link rel="stylesheet" href="styleCollection.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500&family=Dancing+Script:wght@400;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <!-- HEADER -->
      <header class="header">
        <div class="header-left">
          <div class="logo">TT</div>
          <div>
            <h1>Glyph & Silk</h1>
            <p>Typography Studio</p>
          </div>
        </div>
        <div class="header-right">
          <button class="theme-btn" id="themeToggle">
            <span class="material-symbols-outlined">dark_mode</span>
          </button>
          <div class="avatar">
            <span class="material-symbols-outlined">person</span>
          </div>
        </div>
      </header>

      <!-- TITLE -->
      <div class="title-section">
        <h2>Collection & Vault</h2>
        <p class="subtitle">Your saved typography recipes, ready to copy.</p>
      </div>

      <!-- SEARCH -->
      <div class="search-bar">
        <span class="material-symbols-outlined search-icon">search</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search saved fonts..."
        />
      </div>

      <!-- SAVED LIST (populated by JS) -->
      <div class="saved-list" id="savedList"></div>

      <!-- EMPTY STATE -->
      <div class="empty-state" id="emptyState" style="display: none">
        <span class="material-symbols-outlined">bookmark_border</span>
        <h3>No saved fonts yet</h3>
        <p>Tap the ♡ on any font card to save it here.</p>
      </div>

      <!-- BOTTOM NAV -->
      <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
          <span><span class="material-symbols-outlined">atr</span></span>
          <p>Fonts</p>
        </a>
        <a href="indexTheme.html" class="nav-item">
          <span><span class="material-symbols-outlined">palette</span></span>
          <p>Color & FX</p>
        </a>
        <a href="indexCollection.html" class="nav-item active">
          <span><span class="material-symbols-outlined">bookmarks</span></span>
          <p>Collection</p>
        </a>
        <div class="nav-item">
          <span><span class="material-symbols-outlined">ios_share</span></span>
          <p>Export</p>
        </div>
      </nav>
    </div>

    <script src="scriptCollection.js"></script>
  </body>
</html>
