<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glyph & Silk - Collection</title>
    <link rel="stylesheet" href="styleCollection.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Alfa+Slab+One&family=Allura&family=Almendra&family=Amatic+SC&family=Anton&family=Anybody:wght@400;700&family=Architects+Daughter&family=Archivo+Black&family=Audiowide&family=Baloo+2&family=Bebas+Neue&family=Bodoni+Moda:ital@0;1&family=Bowlby+One&family=Bubblegum+Sans&family=Bungee&family=Bungee+Inline&family=Bungee+Outline&family=Bungee+Shade&family=Butcherman&family=Caveat&family=Chewy&family=Cinzel&family=Cinzel+Decorative&family=Codystar&family=Cormorant+Garamond:ital@0;1&family=Creepster&family=DM+Serif+Display:ital@0;1&family=Dancing+Script&family=Datatype&family=Faster+One&family=Fira+Code&family=Freckle+Face&family=Geist+Pixel&family=Geomini&family=Great+Vibes&family=Indie+Flower&family=Instrument+Serif:ital@0;1&family=Inter&family=Italianno&family=JetBrains+Mono&family=Josefin+Sans&family=Julius+Sans+One&family=Kalnia+Glaze&family=Kalam&family=Kranky&family=Major+Mono+Display&family=Metal+Mania&family=Metamorphous&family=Michroma&family=Miltonian&family=Mochiy+Pop+One&family=Modak&family=Monoton&family=Mrs+Saint+Delafield&family=Nanum+Pen+Script&family=Nosifer&family=Nova+Mono&family=Orbitron&family=Outfit&family=Parisienne&family=Passero+One&family=Pinyon+Script&family=Pirata+One&family=Playfair+Display:ital@0;1&family=Poiret+One&family=Prata&family=Righteous&family=Rubik+Glitch&family=Rubik+Moonrocks&family=Sacramento&family=Shadows+Into+Light&family=Silkscreen&family=Sniglet&family=Sora&family=Space+Grotesk&family=Space+Mono&family=Stardos+Stencil&family=Syncopate&family=Syne&family=TASA+Explorer&family=TASA+Orbitor&family=Tan+Pearl&family=Tangerine&family=Tilt+Neon&family=Tilt+Prism&family=Tilt+Warp&family=Unbounded&family=UnifrakturMaguntia&family=Varela+Round&family=Wallpoet&family=Zen+Dots&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-left">
          <div class="logo">TT</div>
          <div>
            <h1>Glyph & Silk</h1>
            <p>Collection</p>
          </div>
        </div>
        <div class="header-right">
          <button class="theme-btn" id="themeToggle">
            <span class="material-symbols-outlined">dark_mode</span>
          </button>
        </div>
      </header>

      <div class="title-section">
        <h2>Collection & Vault</h2>
        <p class="subtitle">Welcome to the collection page.</p>
      </div>

      <div class="stats-row">
        <!-- Pill 1: Total saved fonts -->
        <div class="stat-pill">
          <span class="material-symbols-outlined icon">star</span>
          <span class="stat-number" id="savedCount">0</span>
          <span class="stat-label">Saved</span>
        </div>

        <!-- Pill 2: Total saved color recipes -->
        <div class="stat-pill">
          <span class="material-symbols-outlined icon">palette</span>
          <span class="stat-number" id="colorCount">0</span>
          <span class="stat-label">Color FX</span>
        </div>

        <!-- Pill 3: Total copied fonts -->
        <div class="stat-pill">
          <span class="material-symbols-outlined icon">history</span>
          <span class="stat-number" id="copyCount">0</span>
          <span class="stat-label">Copied</span>
        </div>
      </div>

      <!-- This is where we'll build the list -->
      <div class="saved-list" id="savedList"></div>
      <div class="expAndClear">
        <button class="exportBtn">
          <span class="material-symbols-outlined"> file_export </span>
          Export All(JSON)
        </button>
        <button class="clearBtn">
          <span class="material-symbols-outlined"> delete_forever </span>
          Clear History
        </button>
      </div>

      <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
          <span><span class="material-symbols-outlined">atr</span></span>
          <p>Fonts</p>
        </a>
        <a href="indexTheme.html" class="nav-item">
          <span><span class="material-symbols-outlined">palette</span></span>
          <p>Color & FX</p>
        </a>
        <a href="indexCollection.html" class="nav-item active">
          <span><span class="material-symbols-outlined">bookmarks</span></span>
          <p>Collection</p>
        </a>
        <div class="nav-item">
          <span><span class="material-symbols-outlined">ios_share</span></span>
          <p>Export</p>
        </div>
      </nav>
    </div>

    <script src="scriptCollection.js"></script>
  </body>
</html>
