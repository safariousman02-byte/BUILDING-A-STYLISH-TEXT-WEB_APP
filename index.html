<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glyph & Silk</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts for the different font styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@400;700&family=DM+Serif+Display:ital@0;1&family=Bodoni+Moda:wght@400;700&family=Prata&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Allura&family=Parisienne&family=Alex+Brush&family=Sacramento&family=Pinyon+Script&family=Italiana&family=Tangerine&family=Syne:wght@400;700&family=Space+Grotesk:wght@400;700&family=Outfit:wght@400;700&family=Sora:wght@400;700&family=Unbounded:wght@400;700&family=UnifrakturMaguntia&family=Pirata+One&family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;700&family=Metamorphous&family=Almendra&family=Orbitron:wght@400;700&family=Audiowide&family=Michroma&family=Syncopate:wght@400;700&family=Major+Mono+Display&family=Zen+Dots&family=Bungee+Shade&family=Bungee&family=Monoton&family=Rubik+Glitch&family=Rubik+Moonrocks&family=Silkscreen&family=Josefin+Sans:wght@400;700&family=Quicksand:wght@400;700&family=Comfortaa:wght@400;700&family=Poiret+One&family=Julius+Sans+One&family=Caveat:wght@400;700&family=Kalam:wght@400;700&family=Shadows+Into+Light&family=Indie+Flower&family=Amatic+SC:wght@400;700&family=Fira+Code:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Dancing+Script:wght@400;700&family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <!-- HEADER -->
      <header class="header">
        <div class="header-left">
          <div class="logo">ST</div>
          <div>
            <h1>STYLISH TEXT</h1>
            <p>v2.4 Live</p>
          </div>
        </div>
        <div class="header-right">
          <button class="theme-btn">☾</button>
          <div class="avatar">O</div>
        </div>
      </header>

      <!-- INPUT SECTION -->
      <div class="input-section">
        <div class="label-row">
          <span>✏️ Type your phrase...</span>
          <div class="icons">📋 ⚙️ 🕐</div>
        </div>

        <input class="input-box" placeholder="Enter the text..."></input>

        <div class="formatting-row">
          <button class="as-btn">C</button>
          <button>upper</button>
          <button>lower</button>
          <button>Title</button>
          <button><b>B</b></button>
          <button><i>I</i></button>
          <button><u>U</u></button>
        </div>
      </div>

      <!-- DIMENSIONS & SPACING -->
      <div class="card dimensions-card">
        <div class="card-header">
          <span>📐 Dimensions & Spacing</span>
          <span class="tap-copy">↗ Tap copy</span>
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Glyph Size</span>
            <span>20px</span>
          </div>
          <input type="range" min="10" max="40" value="20" class="slider" />
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>Kerning / Spacing</span>
            <span>+2.0px</span>
          </div>
          <input type="range" min="-5" max="10" value="2" class="slider" />
        </div>

        <div class="button-row">
          <button class="copy-all-btn">📋 Copy All</button>
          <button class="auto-sync-btn">🔗 Auto-sync Disabled</button>
        </div>
      </div>

      <!-- FILTER TABS -->
      <div class="filter-tabs">
        <button class="active">All (48)</button>
        <button>Serif & Bookish</button>
        <button>Minimal Sans</button>
        <button>Script &...</button>
      </div>

      <!-- FONT CARD 1: Editorial Serif -->

      <div class="font-list" id="fontList"></div>

      

      <!-- BOTTOM TIP -->
      <div class="bottom-tip">
        📋 Tap Copy for direct clipboard sync • Tap Heart to save
      </div>

      <!-- BOTTOM NAV -->
      <nav class="bottom-nav">
        <div class="nav-item active">
          <span>TT</span>
          <p>Fonts</p>
        </div>
        <div class="nav-item">
          <span>✳️</span>
          <p>Color & FX</p>
        </div>
        <div class="nav-item">
          <span>📚</span>
          <p>Collection</p>
        </div>
        <div class="nav-item">
          <span>⬇️</span>
          <p>Export</p>
        </div>
      </nav>
    </div>

    <script src="script.js"></script>

  </body>
</html>
